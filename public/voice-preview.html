<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>르블랑 · 보이스 비교</title>
<style>body{margin:0;padding:24px;background:#1d1510;color:#efdfc3;font:16px/1.6 system-ui}main{max-width:1000px;margin:auto}h1{font-family:Georgia,serif}p{color:#c5b496}label{display:block;margin:16px 0}input{margin-right:8px}section{margin:16px 0;padding:16px;border:1px solid #705237;background:#2c2018}h2{font-size:17px;margin:0 0 12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}audio{width:100%;max-width:430px}strong{color:#e9c992}.script{min-height:32px;color:#f2e2c6}a{color:#e9c992}@media(max-width:620px){.pair{grid-template-columns:1fr}body{padding:14px}}</style>
<main><h1>LE BLANC · 종대 / 아엘</h1><p>생성된 파일만 재생합니다. 합의 정확한 수치는 비교 청취 예시이며 게임 질문에 사용하지 않습니다. 자동 디코딩 검사와 실제 청취 평가는 별개입니다.</p><label><input id="all" type="checkbox">운영 대사도 표시</label><p id="status" role="status">음성 목록을 불러옵니다…</p><div id="clips"></div><p><a href="/">게임으로</a> · Voices by <a href="https://typecast.ai/">Typecast</a></p></main>
<script type="module">
const state=document.querySelector('#status'),container=document.querySelector('#clips');let assets=[];
function render(){container.replaceChildren();const ids=[...new Set(assets.flatMap(a=>a.lineIds))].filter(id=>document.querySelector('#all').checked||id.startsWith('AUD_')||id.startsWith('NUM_')).sort();
for(const id of ids){const section=document.createElement('section'),h=document.createElement('h2'),pair=document.createElement('div');h.textContent=id;pair.className='pair';section.append(h,pair);
for(const [voice,name] of [['jongdae','종대'],['ael','아엘']]){const a=assets.find(a=>a.voice===voice&&a.lineIds.includes(id)),div=document.createElement('div'),title=document.createElement('strong'),text=document.createElement('p');title.textContent=name;text.className='script';text.textContent=a?.text??'미생성';div.append(title,text);
if(a?.status==='ready'&&/^\/audio\/voice\/files\/[a-f0-9]{64}\.(mp3|wav)$/.test(a.file)){const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=a.file;audio.setAttribute('aria-label',id+' '+name);audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause();}));div.append(audio);}else{const missing=document.createElement('p');missing.textContent='생성된 파일이 없습니다.';div.append(missing);}pair.append(div);}container.append(section);}}
document.querySelector('#all').addEventListener('change',render);
try{const response=await fetch('/audio/voice/manifest.json');if(!response.ok)throw Error();const data=await response.json();assets=data.assets;state.textContent=`정상 파일 ${assets.filter(a=>a.status==='ready').length}개 · 직접 재생하여 말투와 숫자 구별을 확인하세요.`;render();}catch{state.textContent='음성 목록을 읽지 못했습니다.';}
</script></html>
